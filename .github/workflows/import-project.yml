name: Import complete project

on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit project
        shell: bash
        run: |
          rm -rf .project-import
          unzip -q BossDontFold-ThreeJS-v1.0.zip -d .project-import
          cp -a .project-import/BossDontFold-ThreeJS-v1.0/. .
          rm -rf .project-import BossDontFold-ThreeJS-v1.0.zip .github/workflows/import-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Three.js project"
          git push
