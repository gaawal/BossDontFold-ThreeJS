name: Import mobile layout v1.1

on:
  push:
    paths:
      - '.github/workflows/import-mobile-v1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile layout update
        shell: bash
        run: |
          rm -rf .project-import
          unzip -q BossDontFold-ThreeJS-mobile-v1.1.zip -d .project-import
          cp -a .project-import/BossDontFold-ThreeJS-v1.1/. .
          rm -rf .project-import BossDontFold-ThreeJS-mobile-v1.1.zip .github/workflows/import-mobile-v1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize mobile layout v1.1"
          git push
